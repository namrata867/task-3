<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="box">
    <h1>Create Account</h1>

    <div id="message" class="message"></div>

    <form id="registerForm">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Choose a username" required />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" required />

      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" placeholder="Re-enter your password" required />

      <button type="submit">Register</button>
    </form>

    <p class="link">Already have an account? <a href="index.html">Login here</a></p>
  </div>

  <script src="script.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      // check on the browser side first
      if (password !== confirm) {
        showMessage("Passwords do not match", "error");
        return;
      }
      if (password.length < 6) {
        showMessage("Password must be at least 6 characters", "error");
        return;
      }

      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, email: email, password: password }),
        });

        const data = await res.json();

        if (res.ok) {
          showMessage(data.message, "success");
          document.getElementById("registerForm").reset();
          setTimeout(function () {
            window.location.href = "index.html";
          }, 1200);
        } else {
          showMessage(data.message, "error");
        }
      } catch (err) {
        showMessage("Could not connect to the server", "error");
      }
    });
  </script>
</body>
</html>
